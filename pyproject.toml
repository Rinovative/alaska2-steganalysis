[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "alaska2-steganalysis"
version = "0.2.0"
description = "Reproducible ALASKA2 JPEG steganalysis baselines with a public PD12M proxy."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Rino M. Albertin" }]
keywords = ["steganalysis", "jpeg", "deep-learning", "alaska2"]
dependencies = [
  "ipython>=9.0,<10",
  "ipywidgets>=8.1,<9",
  "jpegio>=0.2.8,<0.3",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pillow>=11.2,<12",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "seaborn>=0.13,<0.14",
  "torch==2.5.1+cpu ; extra != 'cuda'",
  "torchvision==0.20.1+cpu ; extra != 'cuda'",
  "tqdm>=4.67,<5",
]

[project.urls]
Repository = "https://github.com/Rinovative/alaska2-steganalysis"
Notebook = "https://colab.research.google.com/github/Rinovative/alaska2-steganalysis/blob/main/ANN_Projekt_Rino_Albertin_Steganalyse.ipynb"

[project.scripts]
alaska2-dataset-preflight = "src.data.data_preflight:main"
alaska2-gpu-preflight = "src.config.config_device:main"

[project.optional-dependencies]
cuda = [
  "torch==2.5.1+cu121",
  "torchvision==0.20.1+cu121",
]

[tool.poetry]
packages = [{ include = "src" }]
requires-poetry = ">=2.4,<3.0"

[tool.poetry.dependencies]
torch = [
  { markers = "extra != 'cuda'", source = "pytorch-cpu" },
  { markers = "extra == 'cuda'", source = "pytorch-cuda" },
]
torchvision = [
  { markers = "extra != 'cuda'", source = "pytorch-cpu" },
  { markers = "extra == 'cuda'", source = "pytorch-cuda" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
jupyter = ">=1.1,<2"
notebook = ">=7.4,<8"

[tool.poetry.group.optimization]
optional = true

[tool.poetry.group.optimization.dependencies]
optuna = ">=4.4,<5"

[tool.poetry.group.generation]
optional = true

[tool.poetry.group.generation.dependencies]
transformers = ">=4.53,<5"
conseal = { git = "https://github.com/Rinovative/conseal.git", rev = "0b3631dd8f1f00831cc7b8cdb12c9b3f1a100fc9" }
datasets = ">=3.6,<4"
faiss-cpu = ">=1.11,<2"
jpeglib = ">=1.0,<2"
setuptools = ">=75,<81"  # conseal imports pkg_resources at runtime.

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
basedpyright = ">=1.29,<2"
nbformat = ">=5.10,<6"
pytest = ">=8.4,<9"
pytest-cov = ">=6.2,<7"
ruff = ">=0.12,<1"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["ANN_Projekt_Rino_Albertin_Steganalyse.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "NPY", "PERF", "PT", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Global RNG seeding is required at the PyTorch worker boundary.
"src/config/config_runtime.py" = ["NPY002"]
# German notebook-facing labels deliberately preserve their typography.
"src/eda/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
